[package]
name = "hoxay-herdr-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Typed client for the herdr local socket API (Rust port of packages/herdr-client)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
