[package]
name = "conversations"
version = "0.7.0"
edition.workspace = true
license.workspace = true
description = "rebuildup.conversations — provider transcript indexer (native Rust port)"

[lib]
name = "conversations"
path = "src/lib.rs"

[[bin]]
name = "conversations"
path = "src/main.rs"

[dependencies]
hoxay-herdr-client = { path = "../../crates/herdr-client" }
hoxay-tui = { path = "../../crates/tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
memchr = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
