id = "rebuildup.conversations"
name = "Conversations"
version = "0.7.0"
min_herdr_version = "0.9.0"
description = "Provider transcript indexer: normalizes claude/codex/opencode session transcripts into structured conversation events (turn/user/assistant/tool/usage) under herdr-plugins.conversations/v1."
platforms = ["macos"]

# No build step for normal installs: the plugin ships a committed
# prebuilt native binary (ADR-0035). Verified platform: macOS arm64 only;
# other platforms are declared honestly once their binaries exist.
#
# Interactive TUI (contract docs/contracts/tui-v1.md, ADR-0031/0032/0033):
# `main` is the session/history/search browser pane; `open` asks herdr to
# place it in a tab and returns promptly. Reads only on open; `index` is
# reachable inside the UI only via an explicit confirm-gated action.

[[panes]]
id = "main"
title = "Conversations"
platforms = ["macos"]
placement = "tab"
command = ["./bin/conversations", "tui", "main"]

[[actions]]
id = "open"
title = "Conversations: open UI"
description = "Open the conversations browser (sessions, history, search) in a herdr tab."
contexts = ["workspace", "pane"]
command = ["./bin/conversations", "tui", "--open"]
